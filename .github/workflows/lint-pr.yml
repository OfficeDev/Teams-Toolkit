name: "Lint PR"

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - closed
  schedule:
    - cron: "0 8 * * *"

  workflow_dispatch:
    inputs:
      target-branch:
        description: "The target branch of the PR (newly)"
        required: true
        default: "origin/dev"
      source-branch:
        description: "The source branch of the PR"
        required: true
        default: "origin/dev"

  workflow_run:
    workflows: ["CD"]
    types:
      - completed

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  pr-title:
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      # Please look up the latest version from
      # https://github.com/amannn/action-semantic-pull-request/releases
      - uses: amannn/action-semantic-pull-request@db6e259b93f286e3416eef27aaae88935d16cf2e # v3.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            const AZDO_TICKET_REGEX = 'https:\/\/(dev\.azure\.com\/msazure|msazure\.visualstudio\.com)\/Microsoft%20Teams%20Extensibility';
            const AZDO_TICKET_REGEX_WXP = 'https:\/\/office\.visualstudio\.com\/OC';
            const pullRequest = context.payload.pull_request;
            if(pullRequest.title.startsWith("feat")) {
              const body = pullRequest.body;
              const match = body?.match(AZDO_TICKET_REGEX) || body?.match(AZDO_TICKET_REGEX_WXP);
              if(!match) {
                core.setFailed("Feat PR should contains AZDO tickets");
              }
            } else if(pullRequest.title.startsWith("fix")) {
              const body = pullRequest.body;
              const match = body?.match(AZDO_TICKET_REGEX) || body?.match(AZDO_TICKET_REGEX_WXP);
              if(!match && !body) {
                core.setFailed("Fix PR should contains AZDO tickets or descrptions");
              }
            }

  check-format:
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          path: trusted
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Checkout PR source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          path: pr-source
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 8.6.12

      - name: Install trusted tooling
        working-directory: trusted
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      - name: Prepare PR source for trusted linting
        env:
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git -C pr-source remote add upstream "https://github.com/$BASE_REPOSITORY.git"
          git -C pr-source fetch --no-tags upstream "$BASE_SHA"
          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|*eslint.config.*|*.prettierrc.*|*prettier.config.*|eslint-local-rules.js|commitlint.config.js)
                continue
                ;;
            esac
            if [ -L "pr-source/$file" ] || [ ! -f "pr-source/$file" ]; then
              echo "Refusing to lint non-regular file: $file"
              exit 1
            fi
            is_new_file=false
            if [ ! -e "trusted/$file" ]; then
              is_new_file=true
            fi
            mkdir -p "trusted/$(dirname "$file")"
            cp -- "pr-source/$file" "trusted/$file"
            if [ "$is_new_file" = true ]; then
              git -C trusted add --intent-to-add -- "$file"
            fi
          done < <(git -C pr-source diff --diff-filter=MARC --name-only -z "$BASE_SHA...HEAD" -- '*.js' '*.ts' '*.jsx' '*.tsx')

      - name: Lint and format check PR source with trusted tooling
        working-directory: trusted
        run: |
          VAR=$(realpath .github/scripts/lint-pr.sh)
          pnpm -r exec -- bash "$VAR" --working-tree

      - name: Check unused strings
        run: |
          if find \
            pr-source/packages/fx-core/resource/package.nls.json \
            pr-source/packages/fx-core/src \
            pr-source/packages/fx-core/templates/ui \
            -type l -print -quit | grep -q .; then
            echo "Symbolic links are not allowed in unused-string scan inputs."
            exit 1
          fi
          node trusted/packages/fx-core/scripts/find-unused-strings.js \
            pr-source/packages/fx-core/resource/package.nls.json \
            pr-source/packages/fx-core/src \
            pr-source/packages/fx-core/templates/ui
        shell: bash
        env:
          CI: true

  check-yaml-lint:
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Install Yaml lint and mustache
        run: |
          pip install yamllint
          npm install mustache -g
          echo '{"appName":"test"}'>test.json

      - name: Fetch trusted base revision
        env:
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git remote add upstream "https://github.com/$BASE_REPOSITORY.git"
          git fetch --no-tags upstream "$BASE_SHA"

      - name: check yaml lint origin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -d '' templates < <(git diff --diff-filter=MARC --name-only -z "$BASE_SHA...HEAD" -- 'templates/*.yml.tpl')
          printf '%s\n' "${templates[@]}"
          for template in "${templates[@]}"; do
            mustache test.json "$template" | yamllint -d "{extends: relaxed, rules: {line-length: {max: 100}}}" -
          done

  check-sensitive-content:
    if: ${{ (github.event_name == 'pull_request' && github.event.action != 'closed') || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        if: ${{ github.event_name == 'pull_request'}}
        env:
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          echo "depth=$((PR_COMMIT_COUNT + 1))" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ github.event_name == 'pull_request'}}
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{github.event.pull_request.head.repo.full_name}}
          fetch-depth: ${{env.depth}}
      - uses: trufflesecurity/trufflehog@main
        if: ${{ github.event_name == 'pull_request'}}
        with:
          extra_args: --only-verified

      - if: ${{ github.event_name == 'schedule' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: ${{ github.event_name == 'schedule' }}
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --only-verified

  generate-changelog:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ github.event.inputs.target-branch }}
      SOURCE_BRANCH: ${{ github.event.inputs.source-branch }}
      GITHUB_ACTOR_NAME: ${{ github.actor }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.inputs.target-branch }}

      - name: update changelog
        id: update-changelog
        working-directory: ./
        run: |
          git fetch origin "$SOURCE_BRANCH:$SOURCE_BRANCH"
          head=$(git merge-base "$TARGET_BRANCH" "$SOURCE_BRANCH")
          tempfile=$(mktemp)
          REPO_URL="https://github.com/OfficeDev/Teams-toolkit"

          history_cli_feat=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/cli | grep "feat:" || true)
          history_toolkit_feat=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/vscode-extension | grep "feat:" || true)
          history_core_feat=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/fx-core | grep "feat:" || true)
          echo $history_core_feat
          history_sdk_feat=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/sdk | grep "feat:" || true)
          history_sdk_react_feat=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/sdk-react | grep "feat:" || true)
          history_dotnet_sdk_feat=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/dotnet-sdk | grep "feat:" || true)

          cat <<EOF > "$tempfile"
          ### RELEASE $SOURCE_BRANCH...$TARGET_BRANCH
          ### Feature Commits

          #### Fx-core
          $history_core_feat

          #### CLI
          $history_cli_feat

          #### Extension Toolkit
          $history_toolkit_feat

          #### SDK
          $history_sdk_feat

          #### SDK React
          $history_sdk_react_feat

          #### .Net SDK
          $history_dotnet_sdk_feat
          EOF

          history_cli_fix=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/cli | grep "fix:" || true)
          history_toolkit_fix=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/vscode-extension | grep "fix:" || true)
          history_core_fix=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/fx-core | grep "fix:" || true)
          history_sdk_fix=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/sdk | grep "fix:" || true)
          history_sdk_react_fix=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/sdk-react | grep "fix:" || true)
          history_dotnet_sdk_fix=$(git log --pretty=format:"- [%s]($REPO_URL/commit/%h)" $head...HEAD -- ./packages/dotnet-sdk | grep "fix:" || true)

          cat <<EOF >> "$tempfile"

          ### Fix Commits

          #### Fx-core
          $history_core_fix

          #### CLI
          $history_cli_fix

          #### Extension Toolkit
          $history_toolkit_fix

          #### SDK
          $history_sdk_fix

          #### SDK React
          $history_sdk_react_fix

          #### .Net SDK
          $history_dotnet_sdk_fix
          EOF

          cat "$tempfile"
          cat ./packages/vscode-extension/PRERELEASE.md >> "$tempfile"
          mv "$tempfile" ./packages/vscode-extension/PRERELEASE.md
          git checkout -b "changelog/$TARGET_BRANCH"
          echo "=== changelog file path ==="
          echo "https://github.com/OfficeDev/teams-toolkit/blob/changelog/$SOURCE_BRANCH/packages/vscode-extension/PRERELEASE.md"

          body="<h2>CHANGELOG $SOURCE_BRANCH ... $TARGET_BRANCH</h2><h3><a href='https:\/\/github.com\/OfficeDev\/teams-toolkit\/blob\/changelog\/$TARGET_BRANCH\/packages\/vscode-extension\/PRERELEASE.md'>Click Here to Open Changelog File</a></h3>"
          subject="[Changelog] $SOURCE_BRANCH ... $TARGET_BRANCH"

          github_user="$GITHUB_ACTOR_NAME"
          echo "github_user=$github_user"
          accounts_file="./.github/accounts.json"
          email=$(jq -r --arg user "$github_user" '.[$user]' "$accounts_file")
          echo "email=$email"
          echo "body=$body" >> $GITHUB_OUTPUT
          echo "subject=$subject" >> $GITHUB_OUTPUT
          sendTo=$email@microsoft.com
          echo "sendTo=$sendTo" >> $GITHUB_OUTPUT
          echo "send report to $sendTo"

      - name: setup user info
        working-directory: ./
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          user_info=$(curl -s -H "Authorization: token $GH_TOKEN" "https://api.github.com/users/$GITHUB_ACTOR_NAME")
          git config --global user.email "$(echo "$user_info" | jq -r '.name')"
          git config --global user.name "$(echo "$user_info" | jq -r '.name')"
          git add ./packages/vscode-extension/PRERELEASE.md
          git commit -m "dosc: update changelog for release"
          git push --force origin "changelog/$TARGET_BRANCH"

      - name: Send E-mail
        uses: ./.github/actions/send-email-report
        env:
          TO: "${{ steps.update-changelog.outputs.sendTo }}"
          BODY: '"${{ steps.update-changelog.outputs.body }}"'
          SUBJECT: ${{ steps.update-changelog.outputs.subject }}
          MAIL_CLIENT_ID: ${{ secrets.TEST_CLEAN_CLIENT_ID }}
          MAIL_CLIENT_SECRET: ${{ secrets.TEST_CLEAN_CLIENT_SECRET }}
          MAIL_TENANT_ID: ${{ secrets.TEST_CLEAN_TENANT_ID }}
