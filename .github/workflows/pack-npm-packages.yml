name: Pack npm packages

# Packs workspace packages into .tgz files and uploads them as a single
# `npm-packages` artifact, so an Azure DevOps pipeline can download the folder
# and hand it to the ESRP Release task (contenttype: npm, contentsource: Folder).
# ESRP does not build or pack — it only distributes what is in the folder.

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "pnpm filter selecting what to build (suffix with ... to include dependencies)"
        required: false
        default: "@microsoft/app-manifest..."
      packages:
        description: "Comma-separated package names to pack. Empty = every non-private package that was built."
        required: false
        default: "@microsoft/app-manifest"
      release_tag:
        description: "Attach the .tgz files to a GitHub Release under this tag, which also auto-triggers the AzDO pipeline. Use 'auto' for a unique npm-packages-<timestamp> tag. Empty = artifact only."
        required: false
        default: ""

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "${{ inputs.filter }}"

      - name: Build
        run: pnpm --filter "${{ inputs.filter }}" build

      # `pnpm pack` (not `npm pack`) is required: it rewrites `workspace:*`
      # dependency ranges to real versions in the tarball's package.json.
      - name: Pack
        env:
          PACK_PACKAGES: ${{ inputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/npm-packages"

          pnpm -r list --depth -1 --json > /tmp/workspace.json
          PACK_PACKAGES="$PACK_PACKAGES" node -e '
            const list = require("/tmp/workspace.json");
            const wanted = (process.env.PACK_PACKAGES || "")
              .split(",").map(s => s.trim()).filter(Boolean);
            for (const p of list) {
              if (!p.name || !p.path || p.private) continue;
              if (wanted.length && !wanted.includes(p.name)) continue;
              console.log([p.name, p.path].join("\t"));
            }
          ' > /tmp/packlist.txt

          if [ ! -s /tmp/packlist.txt ]; then
            echo "No publishable packages matched." >&2
            exit 1
          fi

          while IFS=$'\t' read -r NAME PKG_PATH; do
            echo "::group::pack $NAME"
            (cd "$PKG_PATH" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/npm-packages")
            echo "::endgroup::"
          done < /tmp/packlist.txt

          ls -l "$GITHUB_WORKSPACE/npm-packages"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: npm-packages/*.tgz
          if-no-files-found: error
          retention-days: 7

      # AzDO triggers on the tag PUSH, so re-using an existing tag would update the
      # release without starting a pipeline run. 'auto' mints a fresh tag each time.
      - name: Resolve release tag
        id: tag
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TAG" = "auto" ]; then
            RESOLVED="npm-packages-$(date -u +%Y%m%d%H%M%S)"
          else
            RESOLVED="$RELEASE_TAG"
          fi
          case "$RESOLVED" in
            npm-packages-*) ;;
            *) echo "Tag '$RESOLVED' will not trigger the AzDO pipeline (needs an npm-packages-* prefix)." >&2 ;;
          esac
          echo "tag=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Release tag: $RESOLVED"

      # Release assets are anonymously downloadable on this public repo, so an
      # Azure DevOps pipeline can fetch them with no credential — the same way the
      # vsix and templates releases are consumed today.
      - name: Attach to GitHub Release
        if: ${{ inputs.release_tag != '' }}
        uses: ncipollo/release-action@58ae73b360456532aafd58ee170c045abbeaee37 # v1.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.tag.outputs.tag }}
          artifacts: npm-packages/*.tgz
          artifactErrorsFailBuild: true
          allowUpdates: true
          prerelease: true
          body: "Packed npm packages for ESRP publish validation. Not a product release."