name: DotNet SDK CI

on:
  push:
    paths:
      - "packages/dotnet-sdk/**"
    branches: [dev, release/**]
  pull_request:
    paths:
      - "packages/dotnet-sdk/**"
    branches: [dev, release/**]
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/dotnet-sdk/

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      - name: Setup .NET
        uses: actions/setup-dotnet@871f041373faaad213a635d9afb62905ec029bbb # v1.10.1
        with:
          dotnet-version: 8.x
      - name: Build
        run: dotnet build -c Release Microsoft.TeamsFx.sln
      - name: Test
        run: dotnet test Microsoft.TeamsFx.sln
