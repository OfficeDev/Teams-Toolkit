name: Office Add-in Manifest Drift Check

on:
  workflow_dispatch:
    inputs:
      ignore_baseline:
        description: "Ignore the recorded baseline and treat all templates as drifted (forces the Copilot judgment + issue path for testing)"
        type: boolean
        default: false
  # schedule:
  #   - cron: "23 6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  detect-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Set up Copilot credentials
        env:
          GH_USER:         ${{ vars.COPILOT_CLI_RUNNER_USER }}
          TEST_USER_TOKEN: ${{ secrets.COPILOT_CLI_RUNNER_TOKEN }}
          GH_APP_ID:       ${{ vars.COPILOT_CLI_RUNNER_APP_ID }}
        run: |
          mkdir -p ~/.config/github-copilot
          echo '{
            "'"github.com:${GH_APP_ID}"'":{
              "user": "'"$GH_USER"'",
              "oauth_token":"'"$TEST_USER_TOKEN"'",
              "githubAppId":"'"$GH_APP_ID"'"
            }
          }' > ~/.config/github-copilot/apps.json
          chmod 600 ~/.config/github-copilot/apps.json

      - name: Detect upstream manifest and code drift
        id: drift_check
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_RUNNER_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IGNORE_BASELINE: ${{ inputs.ignore_baseline }}
        run: |
          export COPILOT_GITHUB_TOKEN=$(python3 -c "import json,os; d=json.load(open(os.path.expanduser('~/.config/github-copilot/apps.json'))); print(list(d.values())[0]['oauth_token'])")
          node ./.github/scripts/check-office-addin-manifest-update.cjs

      - name: Create or update tracking issue
        if: ${{ steps.drift_check.outputs.drift_detected == 'true' }}
        uses: actions/github-script@v7
        env:
          ISSUE_TITLE: ${{ steps.drift_check.outputs.issue_title }}
          ISSUE_BODY: ${{ steps.drift_check.outputs.issue_body }}
          DRIFT_MARKER_VERSION: ${{ steps.drift_check.outputs.drift_marker_version }}
          COPILOT_ASSIGNEE: ${{ vars.COPILOT_ASSIGNEE }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = process.env.ISSUE_TITLE;
            const body = process.env.ISSUE_BODY;
            const markerVersion = process.env.DRIFT_MARKER_VERSION;
            const marker = `<!-- office-addin-manifest-drift:${markerVersion} -->`;

            const assigneesRaw = (process.env.COPILOT_ASSIGNEE || "").trim();
            const assignees = assigneesRaw
              ? assigneesRaw.split(",").map((item) => item.trim()).filter(Boolean)
              : [];

            const labels = [
              { name: "office-addin-manifest-drift", color: "fbca04", description: "Tracks OfficeDev upstream Office Add-in manifest version advances" },
              { name: "copilot-upgrade", color: "0e8a16", description: "Issue is routed for Copilot-assisted upgrade work" }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label.name });
              } catch (error) {
                if (error.status === 404) {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: label.name,
                    color: label.color,
                    description: label.description,
                  });
                } else {
                  throw error;
                }
              }
            }

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "office-addin-manifest-drift",
              per_page: 100,
            });

            const existing = openIssues.find((issue) =>
              !issue.pull_request &&
              (issue.title === title || (issue.body || "").includes(marker))
            );

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
                labels: ["office-addin-manifest-drift", "copilot-upgrade"],
              });

              core.info(`Updated existing issue #${existing.number}`);

              if (assignees.length > 0) {
                try {
                  await github.rest.issues.addAssignees({
                    owner,
                    repo,
                    issue_number: existing.number,
                    assignees,
                  });
                  core.info(`Assigned issue to: ${assignees.join(", ")}`);
                } catch (error) {
                  core.warning(`Could not assign issue: ${error.message}`);
                }
              }
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["office-addin-manifest-drift", "copilot-upgrade"],
                assignees,
              });

              core.info(`Created issue #${created.data.number}`);

              if (assignees.length > 0) {
                core.info(`Assigned to: ${assignees.join(", ")}`);
              }
            }

      - name: Log no-drift result
        if: ${{ steps.drift_check.outputs.drift_detected != 'true' }}
        run: |
          echo "No upstream manifest drift detected."
          echo "AI summary source: ${{ steps.drift_check.outputs.ai_summary_source }}"
