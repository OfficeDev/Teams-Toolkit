version: 1

# Teams remote and local launches cover the complete LLM x language matrix,
# because those dimensions change the rendered package and lifecycle. Azure
# OpenAI covers Playground in every language, while one TypeScript combination
# samples Copilot remote and local without recreating the legacy Cartesian
# product across equivalent launch profiles.
cases:
  - id: general-teams-ts-azure-openai-remote-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-01
    steps:
      [
        scaffold-general-ts-azure-openai,
        check-general-ts-azure-openai,
        login-azure,
        login-m365,
        provision-arm,
        deploy,
        f5-teams-remote-node,
        open-app,
        check-general-chat,
      ]

  - id: general-teams-ts-azure-openai-local-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-01
    steps:
      [
        scaffold-general-ts-azure-openai,
        check-general-ts-azure-openai,
        login-m365,
        f5-teams-local,
        open-app,
        check-general-chat,
      ]

  - id: general-teams-ts-azure-openai-playground
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-01
    steps:
      [
        scaffold-general-ts-azure-openai,
        check-general-ts-azure-openai,
        f5-playground,
        open-app,
        check-general-chat,
      ]

  - id: general-teams-ts-azure-openai-remote-copilot
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-01
    # The run workflow injects this before VS Code starts so scaffold renders
    # the Copilot profiles without mutating user settings or reloading.
    featureFlags:
      - TEAMSFX_CEA_ENABLED=true
    steps:
      [
        scaffold-general-ts-azure-openai,
        check-general-ts-azure-openai,
        login-azure,
        login-m365,
        provision-arm,
        deploy,
        f5-copilot-remote,
        open-agent,
        check-general-chat,
      ]

  - id: general-teams-ts-azure-openai-local-copilot
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-01
    featureFlags:
      - TEAMSFX_CEA_ENABLED=true
    steps:
      [
        scaffold-general-ts-azure-openai,
        check-general-ts-azure-openai,
        login-m365,
        f5-copilot-local,
        open-agent,
        check-general-chat,
      ]

  - id: general-teams-js-azure-openai-remote-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-03
    steps:
      [
        scaffold-general-js-azure-openai,
        check-general-js-azure-openai,
        login-azure,
        login-m365,
        provision-arm,
        deploy,
        f5-teams-remote-node,
        open-app,
        check-general-chat,
      ]

  - id: general-teams-js-azure-openai-local-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-03
    steps:
      [
        scaffold-general-js-azure-openai,
        check-general-js-azure-openai,
        login-m365,
        f5-teams-local,
        open-app,
        check-general-chat,
      ]

  - id: general-teams-js-azure-openai-playground
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-03
    steps:
      [
        scaffold-general-js-azure-openai,
        check-general-js-azure-openai,
        f5-playground,
        open-app,
        check-general-chat,
      ]

  - id: general-teams-py-azure-openai-remote-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-04
    steps:
      [
        scaffold-general-py-azure-openai,
        check-general-py-azure-openai,
        create-python-environment,
        login-azure,
        login-m365,
        provision-arm,
        deploy,
        f5-teams-remote-python,
        open-app,
        check-general-chat,
      ]

  - id: general-teams-py-azure-openai-local-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-04
    steps:
      [
        scaffold-general-py-azure-openai,
        check-general-py-azure-openai,
        create-python-environment,
        login-m365,
        f5-teams-local,
        open-app,
        check-general-chat,
      ]

  - id: general-teams-py-azure-openai-playground
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-04
    steps:
      [
        scaffold-general-py-azure-openai,
        check-general-py-azure-openai,
        create-python-environment,
        f5-playground,
        open-app,
        check-general-chat,
      ]

  # OpenAI remote cases stop after launch. The generated remote infrastructure
  # carries only the key, while local cases can redirect the OpenAI client to an
  # Azure OpenAI v1 endpoint and assert a real completion.
  - id: general-teams-ts-openai-remote-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-01
    steps:
      [
        scaffold-general-ts-openai,
        check-general-ts-openai,
        login-azure,
        login-m365,
        provision-arm,
        deploy,
        f5-teams-remote-node,
        open-app,
      ]

  - id: general-teams-ts-openai-local-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-01
    steps:
      [
        scaffold-general-ts-openai,
        check-general-ts-openai,
        redirect-openai-base-url,
        login-m365,
        f5-teams-local,
        open-app,
        check-general-chat,
      ]

  - id: general-teams-js-openai-remote-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-03
    steps:
      [
        scaffold-general-js-openai,
        check-general-js-openai,
        login-azure,
        login-m365,
        provision-arm,
        deploy,
        f5-teams-remote-node,
        open-app,
      ]

  - id: general-teams-js-openai-local-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-03
    steps:
      [
        scaffold-general-js-openai,
        check-general-js-openai,
        redirect-openai-base-url,
        login-m365,
        f5-teams-local,
        open-app,
        check-general-chat,
      ]

  - id: general-teams-py-openai-remote-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-04
    steps:
      [
        scaffold-general-py-openai,
        check-general-py-openai,
        create-python-environment,
        login-azure,
        login-m365,
        provision-arm,
        deploy,
        f5-teams-remote-python,
        open-app,
      ]

  - id: general-teams-py-openai-local-teams
    scenarioId: SCN-CREATE-CUSTOM-COPILOT-BASIC-04
    steps:
      [
        scaffold-general-py-openai,
        check-general-py-openai,
        create-python-environment,
        redirect-openai-base-url,
        login-m365,
        f5-teams-local,
        open-app,
        check-general-chat,
      ]

steps:
  scaffold-general-ts-azure-openai:
    type: scaffold
    with:
      template: custom-copilot-basic
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-basic
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: typescript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-general-ts-azure-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: src/index.ts
        expect:
          exists: true
      - type: file
        path: src/app/app.ts
        expect:
          exists: true
      - type: file
        path: src/config.ts
        expect:
          contains:
            [
              AZURE_OPENAI_API_KEY,
              AZURE_OPENAI_ENDPOINT,
              AZURE_OPENAI_DEPLOYMENT_NAME,
            ]
          notContains: ["openAIKey: process.env.OPENAI_API_KEY"]
      - type: file
        path: .vscode/launch.json
        expect:
          contains:
            [
              "Launch Remote in Teams (Chrome)",
              "Launch Remote in Copilot (Chrome)",
              "Debug in Teams (Chrome)",
              "Debug in Microsoft 365 Agents Playground",
              "Debug in Copilot (Chrome)",
            ]
      - type: file
        path: package.json
        expect:
          exists: true
      - type: file
        path: appPackage/manifest.json
        expect:
          contains: ['"manifestVersion": "1.29"']

  scaffold-general-js-azure-openai:
    type: scaffold
    with:
      template: custom-copilot-basic
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-basic
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: javascript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-general-js-azure-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: src/index.js
        expect:
          exists: true
      - type: file
        path: src/app/app.js
        expect:
          exists: true
      - type: file
        path: src/config.js
        expect:
          contains:
            [
              AZURE_OPENAI_API_KEY,
              AZURE_OPENAI_ENDPOINT,
              AZURE_OPENAI_DEPLOYMENT_NAME,
            ]
          notContains: ["openAIKey: process.env.OPENAI_API_KEY"]
      - type: file
        path: .vscode/launch.json
        expect:
          contains:
            [
              "Launch Remote in Teams (Chrome)",
              "Launch Remote in Copilot (Chrome)",
              "Debug in Teams (Chrome)",
              "Debug in Microsoft 365 Agents Playground",
              "Debug in Copilot (Chrome)",
            ]
      - type: file
        path: package.json
        expect:
          exists: true
      - type: file
        path: src/index.ts
        expect:
          exists: false

  scaffold-general-py-azure-openai:
    type: scaffold
    with:
      template: custom-copilot-basic
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-basic
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: python
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-general-py-azure-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: src/app.py
        expect:
          exists: true
      - type: file
        path: src/config.py
        expect:
          contains:
            [
              AZURE_OPENAI_API_KEY,
              AZURE_OPENAI_ENDPOINT,
              AZURE_OPENAI_DEPLOYMENT_NAME,
            ]
          notContains: [OPENAI_MODEL_NAME]
      - type: file
        path: src/requirements.txt
        expect:
          contains:
            [microsoft-teams-apps, microsoft.teams.ai, microsoft.teams.openai]
      - type: file
        path: .vscode/launch.json
        expect:
          contains:
            [
              "Launch Remote (Chrome)",
              "Launch Remote in Copilot (Chrome)",
              "Debug in Teams (Chrome)",
              "Debug in Microsoft 365 Agents Playground",
              "Debug in Copilot (Chrome)",
            ]
      - type: file
        path: package.json
        expect:
          exists: false

  scaffold-general-ts-openai:
    type: scaffold
    with:
      template: custom-copilot-basic
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-basic
        - question: llmService
          value: llm-service-openai
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: typescript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-general-ts-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: src/index.ts
        expect:
          exists: true
      - type: file
        path: src/app/app.ts
        expect:
          exists: true
      - type: file
        path: src/config.ts
        expect:
          contains:
            [
              "openAIKey: process.env.OPENAI_API_KEY",
              'openAIModelName: "gpt-3.5-turbo"',
            ]
          notContains: [azureOpenAIKey]
      - type: file
        path: package.json
        expect:
          exists: true

  scaffold-general-js-openai:
    type: scaffold
    with:
      template: custom-copilot-basic
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-basic
        - question: llmService
          value: llm-service-openai
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: javascript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-general-js-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: src/index.js
        expect:
          exists: true
      - type: file
        path: src/app/app.js
        expect:
          exists: true
      - type: file
        path: src/config.js
        expect:
          contains:
            [
              "openAIKey: process.env.OPENAI_API_KEY",
              'openAIModelName: "gpt-3.5-turbo"',
            ]
          notContains: [azureOpenAIKey]
      - type: file
        path: package.json
        expect:
          exists: true

  scaffold-general-py-openai:
    type: scaffold
    with:
      template: custom-copilot-basic
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-basic
        - question: llmService
          value: llm-service-openai
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: python
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-general-py-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: src/app.py
        expect:
          exists: true
      - type: file
        path: src/config.py
        expect:
          contains: ["OPENAI_API_KEY =", "OPENAI_MODEL_NAME='gpt-3.5-turbo'"]
          notContains: [AZURE_OPENAI_API_KEY]
      - type: file
        path: src/requirements.txt
        expect:
          contains:
            [microsoft-teams-apps, microsoft.teams.ai, microsoft.teams.openai]
      - type: file
        path: package.json
        expect:
          exists: false

  create-python-environment:
    type: pythonEnvironment
    with:
      interpreter: "Python 3.12"

  redirect-openai-base-url:
    type: localEnvironment
    with:
      OPENAI_BASE_URL: "${{env:AZURE_OPENAI_ENDPOINT}}/openai/v1"

  login-azure:
    type: login
    with:
      type: azure
      account: "${{env:AZURE_ACCOUNT_NAME}}"
      password: "${{secret:AZURE_ACCOUNT_PASSWORD}}"

  login-m365:
    type: login
    with:
      type: m365
      account: "${{env:M365_ACCOUNT_NAME}}"
      password: "${{secret:M365_ACCOUNT_PASSWORD}}"

  provision-arm:
    type: provision
    with:
      environment: none
      arm:
        targetResourceGroupName: "+ New resource group"
        newResourceGroupName: "${{var:app_name}}-rg"
        newResourceGroupLocation: "${{env:RESOURCE_GROUP_REGION}}"

  deploy:
    type: deploy
    with:
      environment: none

  f5-teams-remote-node:
    type: target
    with:
      profile: "Launch Remote in Teams (Chrome)"
      profileSelection: first

  f5-teams-remote-python:
    type: target
    with:
      profile: "Launch Remote (Chrome)"
      profileSelection: first

  f5-teams-local:
    type: target
    with:
      profile: "Debug in Teams (Chrome)"
      profileSelection: first

  f5-playground:
    type: target
    with:
      profile: "Debug in Microsoft 365 Agents Playground"
      profileSelection: first

  f5-copilot-remote:
    type: target
    with:
      profile: "Launch Remote in Copilot (Chrome)"
      profileSelection: first

  f5-copilot-local:
    type: target
    with:
      profile: "Debug in Copilot (Chrome)"
      profileSelection: first

  open-app:
    type: open
    with:
      kind: app
      destination: chat

  open-agent:
    type: open
    with:
      kind: agent
      destination: chat

  check-general-chat:
    type: checks
    with:
      - type: chat
        send: How to develop agent for Teams?
        expect:
          replied: true
