version: 1

cases:
  - id: simple-bot-ts-publish-developer-portal
    scenarioId: SCN-PUBLISH-DEVELOPER-PORTAL
    workItemIds: [16727621]
    steps:
      [
        scaffold-simple-bot-ts,
        check-simple-bot-ts,
        login-m365,
        f5-teams-local,
        open-app,
        package-local-app,
        publish-developer-portal,
      ]

steps:
  scaffold-simple-bot-ts:
    type: scaffold
    with:
      template: default-bot
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: teams-other-app-type
        - question: teamsOtherAppType
          value: default-bot
        - question: language
          value: typescript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-simple-bot-ts:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains: ["version: v1.11", "provision:", "deploy:"]
      - type: file
        path: app.ts
        expect:
          exists: true
          contains: ["Default echo behavior"]
      - type: file
        path: appPackage/manifest.json
        expect:
          contains: ['"manifestVersion": "1.30"', '"composeExtensions": []']

  login-m365:
    type: login
    with:
      type: m365
      account: "${{env:M365_ACCOUNT_NAME}}"
      password: "${{secret:M365_ACCOUNT_PASSWORD}}"

  f5-teams-local:
    type: target
    with:
      profile: "Debug in Teams (Chrome)"
      profileSelection: first

  open-app:
    type: open
    with:
      kind: app
      destination: chat

  package-local-app:
    type: packageApp
    with:
      environment: local

  publish-developer-portal:
    type: publishDeveloperPortal
