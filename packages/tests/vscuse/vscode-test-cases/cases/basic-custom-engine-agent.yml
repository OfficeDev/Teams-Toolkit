steps:
  scaffold-basic-cea-ts-azure-openai:
    type: scaffold
    with:
      template: basic-custom-engine-agent
      answers:
        - question: projectType
          value: custom-engine-agent-type
        - question: customEngineAgent
          value: basic-custom-engine-agent
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: typescript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  scaffold-basic-cea-ts-openai:
    type: scaffold
    with:
      template: basic-custom-engine-agent
      answers:
        - question: projectType
          value: custom-engine-agent-type
        - question: customEngineAgent
          value: basic-custom-engine-agent
        - question: llmService
          value: llm-service-openai
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: typescript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-basic-cea-ts:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains: ["version: v1.11", "provision:", "deploy:"]
      - type: file
        path: src/index.ts
        expect:
          exists: true
      - type: file
        path: src/app/app.ts
        expect:
          exists: true
      - type: file
        path: src/config.ts
        expect:
          exists: true
      - type: file
        path: package.json
        expect:
          exists: true
      - type: file
        path: infra/azure.bicep
        expect:
          exists: true
      - type: file
        path: appPackage/manifest.json
        expect:
          contains: ['"manifestVersion": "1.29"']

  scaffold-basic-cea-js-azure-openai:
    type: scaffold
    with:
      template: basic-custom-engine-agent
      answers:
        - question: projectType
          value: custom-engine-agent-type
        - question: customEngineAgent
          value: basic-custom-engine-agent
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: javascript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  scaffold-basic-cea-js-openai:
    type: scaffold
    with:
      template: basic-custom-engine-agent
      answers:
        - question: projectType
          value: custom-engine-agent-type
        - question: customEngineAgent
          value: basic-custom-engine-agent
        - question: llmService
          value: llm-service-openai
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: javascript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-basic-cea-js:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains: ["version: v1.11", "provision:", "deploy:"]
      - type: file
        path: src/index.js
        expect:
          exists: true
      - type: file
        path: src/app/app.js
        expect:
          exists: true
      - type: file
        path: src/config.js
        expect:
          exists: true
      - type: file
        path: package.json
        expect:
          exists: true
      - type: file
        path: src/index.ts
        expect:
          exists: false

  scaffold-basic-cea-py-azure-openai:
    type: scaffold
    with:
      template: basic-custom-engine-agent
      answers:
        - question: projectType
          value: custom-engine-agent-type
        - question: customEngineAgent
          value: basic-custom-engine-agent
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: python
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-basic-cea-py:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          exists: true
          contains: ["provision:", "deploy:"]
      - type: file
        path: src/app.py
        expect:
          exists: true
      - type: file
        path: src/agent.py
        expect:
          exists: true
      - type: file
        path: src/config.py
        expect:
          exists: true
      # The Python extension installs exactly this file when the environment is
      # created, so the case asserts it exists before creating the environment.
      - type: file
        path: src/requirements.txt
        expect:
          exists: true
          contains: [microsoft-agents-hosting-aiohttp, openai]
      - type: file
        path: infra/azure.bicep
        expect:
          exists: true
      - type: file
        path: appPackage/manifest.json
        expect:
          contains: ['"manifestVersion": "1.29"']
      # The Python scaffold writes no Node project.
      - type: file
        path: package.json
        expect:
          exists: false

  use-gpt-4o-mini-ts:
    type: openAIModel
    with:
      path: src/config.ts
      current: gpt-3.5-turbo

  use-gpt-4o-mini-js:
    type: openAIModel
    with:
      path: src/config.js
      current: gpt-3.5-turbo

  configure-openai-local:
    type: localEnvironment
    with:
      OPENAI_BASE_URL: "${{env:AZURE_OPENAI_ENDPOINT}}/openai/v1"

  configure-openai-remote:
    type: remoteEnvironment
    with:
      OPENAI_BASE_URL: "${{env:AZURE_OPENAI_ENDPOINT}}/openai/v1"

  # The interpreter label is the patch version the runner image carries. It is
  # authored here rather than fixed in the compiler so an image bump changes one
  # case line instead of every Python plan.
  create-python-environment:
    type: pythonEnvironment
    with:
      interpreter: "Python 3.12"

  login-azure:
    type: login
    with:
      type: azure
      account: "${{env:AZURE_ACCOUNT_NAME}}"
      password: "${{secret:AZURE_ACCOUNT_PASSWORD}}"

  login-m365:
    type: login
    with:
      type: m365
      account: "${{env:M365_ACCOUNT_NAME}}"
      password: "${{secret:M365_ACCOUNT_PASSWORD}}"

  provision-arm:
    type: provision
    with:
      environment: none
      arm:
        targetResourceGroupName: "+ New resource group"
        newResourceGroupName: "${{var:app_name}}-rg"
        newResourceGroupLocation: "${{env:RESOURCE_GROUP_REGION}}"

  deploy:
    type: deploy
    with:
      environment: none

  f5-teams-remote-node:
    type: target
    with:
      profile: "Launch Remote in Teams (Chrome)"
      profileSelection: first

  # The Python template names the remote Teams launch without `in Teams`.
  f5-teams-remote:
    type: target
    with:
      profile: "Launch Remote (Chrome)"
      profileSelection: first

  f5-teams-local:
    type: target
    with:
      profile: "Debug in Teams (Chrome)"
      profileSelection: first

  f5-playground:
    type: target
    with:
      profile: "Debug in Microsoft 365 Agents Playground"
      profileSelection: first

  f5-copilot-remote:
    type: target
    with:
      profile: "(Preview) Launch Remote in Copilot (Chrome)"
      profileSelection: first

  f5-copilot-local:
    type: target
    with:
      profile: "(Preview) Debug in Copilot (Chrome)"
      profileSelection: first

  open-app:
    type: open
    with:
      kind: app
      destination: chat

  open-agent:
    type: open
    with:
      kind: agent
      destination: chat

  # The basic agent answers general questions rather than calling a tool, so the
  # check asserts a reply and no literal the model is not required to produce.
  check-basic-cea-chat:
    type: checks
    with:
      - type: chat
        send: How to develop agent for Teams?
        expect:
          replied: true

  check-basic-cea-error-free-chat:
    type: checks
    with:
      - type: chat
        send: How can I develop agents with Microsoft 365 Agents Toolkit?
        expect:
          replied: true
          notContains: [error]
