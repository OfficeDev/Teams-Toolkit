version: 1

cases:
  - id: feature-local-debug-second-f5
    scenarioId: SCN-CREATE-DEFAULT-BOT-03
    workItemIds: [9795544]
    steps:
      [
        scaffold-simple-bot-js,
        check-simple-bot-js,
        login-m365,
        f5-teams-local,
        open-app,
        close-debug-browser,
        f5-teams-local,
        open-app,
        check-relaunched-chat,
      ]

steps:
  scaffold-simple-bot-js:
    type: scaffold
    with:
      template: default-bot
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: teams-other-app-type
        - question: teamsOtherAppType
          value: default-bot
        - question: language
          value: javascript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-simple-bot-js:
    type: checks
    with:
      - type: file
        path: app.js
        expect:
          contains: [Default echo behavior]
      - type: file
        path: index.js
        expect:
          exists: true
      - type: file
        path: .vscode/launch.json
        expect:
          contains:
            [
              '"name": "Debug in Teams (Chrome)"',
              '"stopAll": true',
              cascadeTerminateToConfigurations,
            ]

  login-m365:
    type: login
    with:
      type: m365
      account: "${{env:M365_ACCOUNT_NAME}}"
      password: "${{secret:M365_ACCOUNT_PASSWORD}}"

  f5-teams-local:
    type: target
    with:
      profile: Debug in Teams (Chrome)
      profileSelection: first

  open-app:
    type: open
    with:
      kind: app
      destination: chat

  close-debug-browser:
    type: closeDebugBrowser
    with: {}

  check-relaunched-chat:
    type: checks
    with:
      - type: chat
        send: test
        expect:
          replied: true
          contains: ["you said: test"]
