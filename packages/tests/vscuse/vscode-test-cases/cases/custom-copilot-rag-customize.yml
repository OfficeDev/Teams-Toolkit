version: 1

# Every LLM service and language reaches a local Teams launch, because those
# dimensions change the rendered data source, config module, and local
# lifecycle. One Python OpenAI case samples the local Copilot surface without
# recreating the legacy Cartesian product across equivalent launch profiles.
cases:
  - id: rag-customize-ts-azure-openai-local-teams
    scenarioId: SCN-CREATE-RAG-CUSTOMIZE-01
    steps:
      [
        scaffold-rag-customize-ts-azure-openai,
        check-rag-customize-ts-azure-openai,
        login-m365,
        f5-teams-local,
        open-app,
        check-rag-customize-chat,
      ]

  - id: rag-customize-ts-openai-local-teams
    scenarioId: SCN-CREATE-RAG-CUSTOMIZE-01
    steps:
      [
        scaffold-rag-customize-ts-openai,
        check-rag-customize-ts-openai,
        redirect-openai-base-url,
        login-m365,
        f5-teams-local,
        open-app,
        check-rag-customize-chat,
      ]

  - id: rag-customize-js-azure-openai-local-teams
    scenarioId: SCN-CREATE-RAG-CUSTOMIZE-03
    steps:
      [
        scaffold-rag-customize-js-azure-openai,
        check-rag-customize-js-azure-openai,
        login-m365,
        f5-teams-local,
        open-app,
        check-rag-customize-chat,
      ]

  - id: rag-customize-js-openai-local-teams
    scenarioId: SCN-CREATE-RAG-CUSTOMIZE-03
    steps:
      [
        scaffold-rag-customize-js-openai,
        check-rag-customize-js-openai,
        redirect-openai-base-url,
        login-m365,
        f5-teams-local,
        open-app,
        check-rag-customize-chat,
      ]

  - id: rag-customize-py-azure-openai-local-teams
    scenarioId: SCN-CREATE-RAG-CUSTOMIZE-04
    steps:
      [
        scaffold-rag-customize-py-azure-openai,
        check-rag-customize-py-azure-openai,
        create-python-environment,
        login-m365,
        f5-teams-local,
        open-app,
        check-rag-customize-chat,
      ]

  - id: rag-customize-py-openai-local-teams
    scenarioId: SCN-CREATE-RAG-CUSTOMIZE-04
    steps:
      [
        scaffold-rag-customize-py-openai,
        check-rag-customize-py-openai,
        create-python-environment,
        redirect-openai-base-url,
        login-m365,
        f5-teams-local,
        open-app,
        check-rag-customize-chat,
      ]

  - id: rag-customize-py-openai-local-copilot
    scenarioId: SCN-CREATE-RAG-CUSTOMIZE-04
    # The run workflow injects this before VS Code starts so scaffold renders
    # the Copilot profiles without mutating user settings or reloading.
    featureFlags:
      - TEAMSFX_CEA_ENABLED=true
    steps:
      [
        scaffold-rag-customize-py-openai,
        check-rag-customize-py-openai,
        check-rag-customize-copilot-launch,
        create-python-environment,
        redirect-openai-base-url,
        login-m365,
        f5-copilot-local,
        open-agent,
        check-rag-customize-chat,
      ]

steps:
  scaffold-rag-customize-ts-azure-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-customize
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-customize
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: typescript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-customize-ts-azure-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: src/app/myDataSource.ts
        expect:
          exists: true
      - type: file
        path: src/data/Contoso_Electronics_Plan_Benefits.md
        expect:
          exists: true
      - type: file
        path: src/config.ts
        expect:
          contains:
            [
              "azureOpenAIKey: process.env.AZURE_OPENAI_API_KEY",
              "azureOpenAIEndpoint: process.env.AZURE_OPENAI_ENDPOINT",
              "azureOpenAIDeploymentName: process.env.AZURE_OPENAI_DEPLOYMENT_NAME",
            ]
          notContains: ["openAIKey: process.env.OPENAI_API_KEY"]
      - type: file
        path: .vscode/launch.json
        expect:
          contains:
            [
              "Debug in Teams (Chrome)",
              "Debug in Microsoft 365 Agents Playground",
            ]
      - type: file
        path: package.json
        expect:
          exists: true
      - type: file
        path: appPackage/manifest.json
        expect:
          contains: ['"manifestVersion": "1.29"']

  scaffold-rag-customize-ts-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-customize
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-customize
        - question: llmService
          value: llm-service-openai
        # The OpenAI client is redirected to an Azure OpenAI v1 endpoint before
        # launch, so the case supplies the Azure OpenAI key here.
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: typescript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-customize-ts-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: src/app/myDataSource.ts
        expect:
          exists: true
      - type: file
        path: src/data/Contoso_Electronics_Plan_Benefits.md
        expect:
          exists: true
      - type: file
        path: src/config.ts
        expect:
          contains:
            [
              "openAIKey: process.env.OPENAI_API_KEY",
              'openAIModelName: "gpt-3.5-turbo"',
            ]
          notContains: [azureOpenAIKey]
      - type: file
        path: package.json
        expect:
          exists: true

  scaffold-rag-customize-js-azure-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-customize
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-customize
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: javascript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-customize-js-azure-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: src/app/myDataSource.js
        expect:
          exists: true
      - type: file
        path: src/data/Contoso_Electronics_Plan_Benefits.md
        expect:
          exists: true
      - type: file
        path: src/config.js
        expect:
          contains:
            [
              "azureOpenAIKey: process.env.AZURE_OPENAI_API_KEY",
              "azureOpenAIEndpoint: process.env.AZURE_OPENAI_ENDPOINT",
              "azureOpenAIDeploymentName: process.env.AZURE_OPENAI_DEPLOYMENT_NAME",
            ]
          notContains: ["openAIKey: process.env.OPENAI_API_KEY"]
      - type: file
        path: src/config.ts
        expect:
          exists: false

  scaffold-rag-customize-js-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-customize
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-customize
        - question: llmService
          value: llm-service-openai
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: javascript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-customize-js-openai:
    type: checks
    with:
      - type: file
        path: src/app/myDataSource.js
        expect:
          exists: true
      - type: file
        path: src/config.js
        expect:
          contains:
            [
              "openAIKey: process.env.OPENAI_API_KEY",
              'openAIModelName: "gpt-3.5-turbo"',
            ]
          notContains: [azureOpenAIKey]
      - type: file
        path: package.json
        expect:
          exists: true

  scaffold-rag-customize-py-azure-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-customize
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-customize
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: python
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-customize-py-azure-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: src/my_data_source.py
        expect:
          exists: true
      - type: file
        path: src/data/Contoso_Electronics_Plan_Benefits.md
        expect:
          exists: true
      - type: file
        path: src/config.py
        expect:
          contains:
            [
              AZURE_OPENAI_API_KEY,
              AZURE_OPENAI_ENDPOINT,
              AZURE_OPENAI_DEPLOYMENT_NAME,
            ]
          notContains: [OPENAI_MODEL_NAME]
      - type: file
        path: src/requirements.txt
        expect:
          contains:
            [microsoft-teams-apps, microsoft.teams.ai, microsoft.teams.openai]
      - type: file
        path: package.json
        expect:
          exists: false

  scaffold-rag-customize-py-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-customize
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-customize
        - question: llmService
          value: llm-service-openai
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: python
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-customize-py-openai:
    type: checks
    with:
      - type: file
        path: src/my_data_source.py
        expect:
          exists: true
      - type: file
        path: src/config.py
        expect:
          contains: [OPENAI_API_KEY, "OPENAI_MODEL_NAME='gpt-3.5-turbo'"]
          notContains: [AZURE_OPENAI_API_KEY]
      - type: file
        path: src/requirements.txt
        expect:
          contains:
            [microsoft-teams-apps, microsoft.teams.ai, microsoft.teams.openai]

  # The Copilot launch profiles render only when the feature flag the case
  # declares is set before VS Code starts.
  check-rag-customize-copilot-launch:
    type: checks
    with:
      - type: file
        path: .vscode/launch.json
        expect:
          contains: ["Debug in Copilot (Chrome)"]

  create-python-environment:
    type: pythonEnvironment
    with:
      interpreter: "Python 3.12"

  # The OpenAI branch reads OPENAI_BASE_URL, so pointing it at the Azure OpenAI
  # v1 surface lets the case reuse the Azure OpenAI key it already supplied.
  redirect-openai-base-url:
    type: localEnvironment
    with:
      OPENAI_BASE_URL: "${{env:AZURE_OPENAI_ENDPOINT}}/openai/v1"

  login-m365:
    type: login
    with:
      type: m365
      account: "${{env:M365_ACCOUNT_NAME}}"
      password: "${{secret:M365_ACCOUNT_PASSWORD}}"

  f5-teams-local:
    type: target
    with:
      profile: "Debug in Teams (Chrome)"
      profileSelection: first

  f5-copilot-local:
    type: target
    with:
      profile: "Debug in Copilot (Chrome)"
      profileSelection: first

  open-app:
    type: open
    with:
      kind: app
      destination: chat

  open-agent:
    type: open
    with:
      kind: agent
      destination: chat

  check-rag-customize-chat:
    type: checks
    with:
      # The sample data ships with the template, but the reply wording comes
      # from the model, so the case asserts that the agent answered without
      # failing rather than asserting text this repository does not control.
      - type: chat
        send: What is included in the Contoso Electronics PerksPlus program?
        expect:
          replied: true
          notContains: ["error"]
