        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: python
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-customize-py-azure-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: src/my_data_source.py
        expect:
          exists: true
      - type: file
        path: src/data/Contoso_Electronics_Plan_Benefits.md
        expect:
          exists: true
      - type: file
        path: src/config.py
        expect:
          contains:
            [
              AZURE_OPENAI_API_KEY,
              AZURE_OPENAI_ENDPOINT,
              AZURE_OPENAI_DEPLOYMENT_NAME,
            ]
          notContains: [OPENAI_MODEL_NAME]
      - type: file
        path: src/requirements.txt
        expect:
          contains:
            [microsoft-teams-apps, microsoft.teams.ai, microsoft.teams.openai]
      - type: file
        path: package.json
        expect:
          exists: false

  scaffold-rag-customize-py-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-customize
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-customize
        - question: llmService
          value: llm-service-openai
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: python
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-customize-py-openai:
    type: checks
    with:
      - type: file
        path: src/my_data_source.py
        expect:
          exists: true
      - type: file
        path: src/config.py
        expect:
          contains: [OPENAI_API_KEY, "OPENAI_MODEL_NAME='gpt-3.5-turbo'"]
          notContains: [AZURE_OPENAI_API_KEY]
      - type: file
        path: src/requirements.txt
        expect:
          contains:
            [microsoft-teams-apps, microsoft.teams.ai, microsoft.teams.openai]

  # The Copilot launch profiles render only when the feature flag the case
  # declares is set before VS Code starts.
  check-rag-customize-copilot-launch:
    type: checks
    with:
      - type: file
        path: .vscode/launch.json
        expect:
          contains: ["Debug in Copilot (Chrome)"]

  check-rag-customize-copilot-remote-launch:
    type: checks
    with:
      - type: file
        path: .vscode/launch.json
        expect:
          contains: ["Launch Remote in Copilot (Chrome)"]

  create-python-environment:
    type: pythonEnvironment
    with:
      interpreter: "Python 3.12"

  use-gpt-4o-mini-ts:
    type: openAIModel
    with:
      path: src/config.ts
      current: gpt-3.5-turbo

  use-gpt-4o-mini-js:
    type: openAIModel
    with:
      path: src/config.js
      current: gpt-3.5-turbo

  use-gpt-4o-mini-py:
    type: openAIModel
    with:
      path: src/config.py
      current: gpt-3.5-turbo

  # The OpenAI branch reads OPENAI_BASE_URL, so pointing it at the Azure OpenAI
  # v1 surface lets the case reuse the Azure OpenAI key it already supplied.
  redirect-openai-base-url:
    type: localEnvironment
    with:
      OPENAI_BASE_URL: "${{env:AZURE_OPENAI_ENDPOINT}}/openai/v1"

  redirect-openai-base-url-remote:
    type: remoteEnvironment
    with:
      OPENAI_BASE_URL: "${{env:AZURE_OPENAI_ENDPOINT}}/openai/v1"

  login-azure:
    type: login
    with:
      type: azure
      account: "${{env:AZURE_ACCOUNT_NAME}}"
      password: "${{secret:AZURE_ACCOUNT_PASSWORD}}"

  login-m365:
    type: login
    with:
      type: m365
      account: "${{env:M365_ACCOUNT_NAME}}"
      password: "${{secret:M365_ACCOUNT_PASSWORD}}"

  provision-arm:
    type: provision
    with:
      environment: none
      arm:
        targetResourceGroupName: "+ New resource group"
        newResourceGroupName: "${{var:app_name}}-rg"
        newResourceGroupLocation: "${{env:RESOURCE_GROUP_REGION}}"

  deploy:
    type: deploy
    with:
      environment: none

  f5-teams-local:
    type: target
    with:
      profile: "Debug in Teams (Chrome)"
      profileSelection: first

  f5-copilot-local:
    type: target
    with:
      profile: "Debug in Copilot (Chrome)"
      profileSelection: first

  f5-copilot-remote:
    type: target
    with:
      profile: "Launch Remote in Copilot (Chrome)"
      profileSelection: first

  f5-teams-remote:
    type: target
    with:
      profile: "Launch Remote in Teams (Chrome)"
      profileSelection: first

  f5-teams-remote-python:
    type: target
    with:
      profile: "Launch Remote (Chrome)"
      profileSelection: first

  f5-playground:
    type: target
    with:
      profile: "Debug in Microsoft 365 Agents Playground"
      profileSelection: first

  open-app:
    type: open
    with:
      kind: app
      destination: chat

  open-agent:
    type: open
    with:
      kind: agent
      destination: chat

  check-rag-customize-chat:
    type: checks
    with:
      # The sample data ships with the template, but the reply wording comes
      # from the model, so the case asserts that the agent answered without
      # failing rather than asserting text this repository does not control.
      - type: chat
        send: What is included in the Contoso Electronics PerksPlus program?
        expect:
          replied: true
          notContains: ["error"]

  check-rag-customize-chat-openai:
    type: checks
    with:
      - type: chat
        send: What is included in the Contoso Electronics PerksPlus program?
        expect:
          replied: true
          notContains: ["error"]

  check-rag-customize-chat-openai-remote-teams:
    type: checks
    with:
      - type: chat
        send: Compare Contoso Electronics plan
        expect:
          replied: true
          notContains: ["error"]

  check-rag-customize-chat-azure-openai-remote-teams:
    type: checks
    with:
      - type: chat
        send: Compare Contoso Electronics plan
        expect:
          replied: true
          notContains: ["error"]

  check-rag-customize-chat-python-remote-teams:
    type: checks
    with:
      - type: chat
        send: List Contoso history in table
        expect:
          contains: ["1985"]

  check-rag-customize-copilot-chat:
    type: checks
    with:
      - type: chat
        send: Tell me the history of Contoso Electronics, format in a table.
        expect:
          replied: true
          notContains: ["error"]

  check-rag-customize-copilot-chat-openai:
    type: checks
    with:
      - type: chat
        send: How to develop agent for Teams?
        expect:
          replied: true
          notContains: ["error"]

  check-rag-customize-playground-chat:
    type: checks
    with:
      - type: chat
        send: hi
        expect:
          replied: true
      - type: chat
        send: List Contoso history in table
        expect:
          replied: true
