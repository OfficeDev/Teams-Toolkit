version: 1

cases:
  - id: da-no-action-add-openapi-action
    scenarioId: SCN-DA-ADD-OPENAPI-ACTION
    workItemIds: [28941585]
    steps:
      [
        scaffold-da-no-action,
        check-da-no-action,
        add-openapi-action,
        check-openapi-action,
      ]

  - id: da-no-action-add-mcp-bearer-action
    scenarioId: SCN-DA-ADD-MCP-ACTION-TO-DA
    workItemIds: [99999999] # TODO: replace with the Azure DevOps test case ID.
    steps:
      [
        scaffold-da-no-action,
        check-da-no-action,
        add-mcp-bearer-action,
        check-mcp-bearer-action,
      ]

steps:
  scaffold-da-no-action:
    type: scaffold
    with:
      template: da/no-action
      answers:
        - question: projectType
          value: copilot-agent-type
        - question: daTemplate
          value: no-action
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-da-no-action:
    type: checks
    with:
      - type: file
        path: appPackage/declarativeAgent.json
        expect:
          exists: true
          notContains: ['"actions"']
      - type: file
        path: appPackage/ai-plugin.json
        expect:
          exists: false

  add-openapi-action:
    type: addDaAction
    with:
      source: openapi
      url: https://raw.githubusercontent.com/huimiu/api-spec-example/main/repair-service.yml
      operations: all

  check-openapi-action:
    type: checks
    with:
      - type: file
        path: appPackage/ai-plugin.json
        expect:
          exists: true
      - type: file
        path: appPackage/apiSpecificationFile/openapi.yaml
        expect:
          exists: true
      - type: file
        path: appPackage/declarativeAgent.json
        expect:
          contains: ['"actions"', '"id": "action_1"']

  add-mcp-bearer-action:
    type: addDaAction
    with:
      source: mcp
      url: https://example.com/mcp
      authType: bearer-token

  check-mcp-bearer-action:
    type: checks
    with:
      - type: file
        path: appPackage/ai-plugin.json
        expect:
          contains:
            - '"type": "RemoteMCPServer"'
            - '"url": "https://example.com/mcp"'
            - '"type": "ApiKeyPluginVault"'
            - '"reference_id": "${{MCP_DA_AUTH_ID_EXAMPLECOM}}"'
          notContains:
            ["OAuthPluginVault", "client_id", "client_secret", "scopes"]
      - type: file
        path: appPackage/declarativeAgent.json
        expect:
          contains:
            ['"actions"', '"id": "action_1"', '"file": "ai-plugin.json"']
      - type: file
        path: m365agents.yml
        expect:
          contains:
            - "uses: apiKey/register"
            - "name: examplecom"
            - "baseUrl: https://example.com/mcp"
            - "registrationId: MCP_DA_AUTH_ID_EXAMPLECOM"
          notContains:
            ["oauth/register", "dcr/register", "clientId:", "clientSecret:"]
      - type: file
        path: m365agents.local.yml
        expect:
          contains:
            - "uses: apiKey/register"
            - "name: examplecom"
            - "baseUrl: https://example.com/mcp"
            - "registrationId: MCP_DA_AUTH_ID_EXAMPLECOM"
          notContains:
            ["oauth/register", "dcr/register", "clientId:", "clientSecret:"]
