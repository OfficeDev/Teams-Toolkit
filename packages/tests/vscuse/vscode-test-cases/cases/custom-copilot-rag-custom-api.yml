steps:
  scaffold-rag-custom-api-ts-azure-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-custom-api
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-custom-api
        - question: apiSpecLocation
          type: text
          value: https://raw.githubusercontent.com/SLdragon/example-openapi-spec/main/real-no-auth.yaml
        - question: apiOperations
          type: multiSelect
          value: all
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: typescript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-custom-api-ts-azure-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: appPackage/apiSpecificationFile/openapi.yaml
        expect:
          exists: true
      - type: file
        path: src/app/handlers.ts
        expect:
          exists: true
      - type: file
        path: src/app/functions.json
        expect:
          exists: true
      - type: file
        path: src/config.ts
        expect:
          contains:
            [
              "azureOpenAIKey: process.env.AZURE_OPENAI_API_KEY",
              "azureOpenAIDeployment: process.env.AZURE_OPENAI_DEPLOYMENT_NAME",
            ]
          notContains: ["openAIKey: process.env.OPENAI_API_KEY"]
      - type: file
        path: .vscode/launch.json
        expect:
          contains:
            [
              "Debug in Teams (Chrome)",
              "Debug in Microsoft 365 Agents Playground",
            ]
      - type: file
        path: package.json
        expect:
          exists: true
      - type: file
        path: appPackage/manifest.json
        expect:
          contains: ['"manifestVersion": "1.29"']

  scaffold-rag-custom-api-ts-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-custom-api
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-custom-api
        - question: apiSpecLocation
          type: text
          value: https://raw.githubusercontent.com/SLdragon/example-openapi-spec/main/real-no-auth.yaml
        - question: apiOperations
          type: multiSelect
          value: all
        - question: llmService
          value: llm-service-openai
        # The OpenAI client is redirected to an Azure OpenAI v1 endpoint before
        # launch, so the case supplies the Azure OpenAI key here.
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: typescript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-custom-api-ts-openai:
    type: checks
    with:
      - type: file
        path: appPackage/apiSpecificationFile/openapi.yaml
        expect:
          exists: true
      - type: file
        path: src/app/handlers.ts
        expect:
          exists: true
      - type: file
        path: src/config.ts
        expect:
          contains: ["openAIKey: process.env.OPENAI_API_KEY"]
          notContains: [azureOpenAIKey]

  scaffold-rag-custom-api-js-azure-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-custom-api
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-custom-api
        - question: apiSpecLocation
          type: text
          value: https://raw.githubusercontent.com/SLdragon/example-openapi-spec/main/real-no-auth.yaml
        - question: apiOperations
          type: multiSelect
          value: all
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: javascript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-custom-api-js-azure-openai:
    type: checks
    with:
      - type: file
        path: appPackage/apiSpecificationFile/openapi.yaml
        expect:
          exists: true
      - type: file
        path: src/app/handlers.js
        expect:
          exists: true
      - type: file
        path: src/config.js
        expect:
          contains:
            [
              "azureOpenAIKey: process.env.AZURE_OPENAI_API_KEY",
              "azureOpenAIDeployment: process.env.AZURE_OPENAI_DEPLOYMENT_NAME",
            ]
          notContains: ["openAIKey: process.env.OPENAI_API_KEY"]
      - type: file
        path: src/config.ts
        expect:
          exists: false

  scaffold-rag-custom-api-js-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-custom-api
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-custom-api
        - question: apiSpecLocation
          type: text
          value: https://raw.githubusercontent.com/SLdragon/example-openapi-spec/main/real-no-auth.yaml
        - question: apiOperations
          type: multiSelect
          value: all
        - question: llmService
          value: llm-service-openai
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: javascript
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-custom-api-js-openai:
    type: checks
    with:
      - type: file
        path: appPackage/apiSpecificationFile/openapi.yaml
        expect:
          exists: true
      - type: file
        path: src/app/handlers.js
        expect:
          exists: true
      - type: file
        path: src/config.js
        expect:
          contains: ["openAIKey: process.env.OPENAI_API_KEY"]
          notContains: [azureOpenAIKey]

  scaffold-rag-custom-api-py-azure-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-custom-api
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-custom-api
        - question: apiSpecLocation
          type: text
          value: https://raw.githubusercontent.com/SLdragon/example-openapi-spec/main/real-no-auth.yaml
        - question: apiOperations
          type: multiSelect
          value: all
        - question: llmService
          value: llm-service-azure-openai
        - question: azureOpenAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: azureOpenAIEndpoint
          type: text
          value: "${{env:AZURE_OPENAI_ENDPOINT}}"
        - question: azureOpenAIDeploymentName
          type: text
          value: "${{env:AZURE_OPENAI_MODEL}}"
        - question: language
          value: python
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-custom-api-py-azure-openai:
    type: checks
    with:
      - type: file
        path: m365agents.yml
        expect:
          contains:
            ["version: v1.11", "provision:", "deploy:", "teamsApp/extendToM365"]
      - type: file
        path: appPackage/apiSpecificationFile/openapi.yaml
        expect:
          exists: true
      - type: file
        path: src/bot.py
        expect:
          exists: true
      - type: file
        path: src/prompts/chat/config.json
        expect:
          exists: true
      - type: file
        path: src/config.py
        expect:
          contains:
            [
              AZURE_OPENAI_API_KEY,
              AZURE_OPENAI_ENDPOINT,
              AZURE_OPENAI_DEPLOYMENT_NAME,
            ]
          notContains: [OPENAI_MODEL_NAME]
      - type: file
        path: requirements.txt
        expect:
          exists: true
      - type: file
        path: package.json
        expect:
          exists: false

  scaffold-rag-custom-api-py-openai:
    type: scaffold
    with:
      template: custom-copilot-rag-custom-api
      answers:
        - question: projectType
          value: teams-agent-and-app-type
        - question: teamsAppType
          value: custom-copilot-rag
        - question: customCopilotRag
          value: custom-copilot-rag-custom-api
        - question: apiSpecLocation
          type: text
          value: https://raw.githubusercontent.com/SLdragon/example-openapi-spec/main/real-no-auth.yaml
        - question: apiOperations
          type: multiSelect
          value: all
        - question: llmService
          value: llm-service-openai
        - question: openAIKey
          type: text
          value: "${{secret:AZURE_OPENAI_API_KEY}}"
        - question: language
          value: python
        - question: workspaceFolder
          value: default
        - question: appName
          type: text
          value: "${{var:app_name:vscuse_app_#####}}"

  check-rag-custom-api-py-openai:
    type: checks
    with:
      - type: file
        path: appPackage/apiSpecificationFile/openapi.yaml
        expect:
          exists: true
      - type: file
        path: src/bot.py
        expect:
          exists: true
      - type: file
        path: src/config.py
        expect:
          contains: [OPENAI_API_KEY, "OPENAI_MODEL_NAME='gpt-3.5-turbo'"]
          notContains: [AZURE_OPENAI_API_KEY]

  create-python-environment:
    type: pythonEnvironment
    with:
      interpreter: "Python 3.12"

  use-gpt-4o-mini-ts:
    type: openAIModel
    with:
      path: src/app/app.ts
      current: gpt-3.5-turbo

  use-gpt-4o-mini-js:
    type: openAIModel
    with:
      path: src/app/app.js
      current: gpt-3.5-turbo

  use-gpt-4o-mini-py:
    type: openAIModel
    with:
      path: src/config.py
      current: gpt-3.5-turbo

  # The OpenAI branch reads OPENAI_BASE_URL, so pointing it at the Azure OpenAI
  # v1 surface lets the case reuse the Azure OpenAI key it already supplied.
  redirect-openai-base-url:
    type: localEnvironment
    with:
      OPENAI_BASE_URL: "${{env:AZURE_OPENAI_ENDPOINT}}/openai/v1"

  redirect-openai-base-url-remote:
    type: remoteEnvironment
    with:
      OPENAI_BASE_URL: "${{env:AZURE_OPENAI_ENDPOINT}}/openai/v1"

  login-azure:
    type: login
    with:
      type: azure
      account: "${{env:AZURE_ACCOUNT_NAME}}"
      password: "${{secret:AZURE_ACCOUNT_PASSWORD}}"

  login-m365:
    type: login
    with:
      type: m365
      account: "${{env:M365_ACCOUNT_NAME}}"
      password: "${{secret:M365_ACCOUNT_PASSWORD}}"

  provision-arm:
    type: provision
    with:
      environment: none
      arm:
        targetResourceGroupName: "+ New resource group"
        newResourceGroupName: "${{var:app_name}}-rg"
        newResourceGroupLocation: "${{env:RESOURCE_GROUP_REGION}}"

  deploy:
    type: deploy
    with:
      environment: none

  f5-teams-local:
    type: target
    with:
      profile: "Debug in Teams (Chrome)"
      profileSelection: first

  f5-teams-remote:
    type: target
    with:
      profile: "Launch Remote in Teams (Chrome)"
      profileSelection: first

  f5-teams-remote-python:
    type: target
    with:
      profile: "Launch Remote (Chrome)"
      profileSelection: first

  f5-playground:
    type: target
    with:
      profile: "Debug in Microsoft 365 Agents Playground"
      profileSelection: first

  open-app:
    type: open
    with:
      kind: app
      destination: chat

  check-rag-custom-api-chat:
    type: checks
    with:
      # The generated actions call a public sample API and the reply wording
      # comes from the model, so the case asserts that the agent answered without
      # failing rather than asserting text this repository does not control.
      - type: chat
        send: List all the repairs
        expect:
          replied: true
          notContains: ["error"]

  check-rag-custom-api-chat-openai:
    type: checks
    with:
      - type: chat
        send: List all the repairs
        expect:
          replied: true
          notContains: ["error"]

  check-rag-custom-api-chat-openai-remote:
    type: checks
    with:
      - type: chat
        send: List all repairs without auth
        expect:
          replied: true
          notContains: ["error"]

  check-rag-custom-api-chat-node-remote:
    type: checks
    with:
      - type: chat
        send: get repairs assign karin
        expect:
          replied: true
          notContains: ["error"]

  check-rag-custom-api-chat-python-remote:
    type: checks
    with:
      - type: chat
        send: list all repairs without auth
        expect:
          replied: true
          notContains: ["error"]

  check-rag-custom-api-playground-chat:
    type: checks
    with:
      - type: chat
        send: get repairs assign Karin
        expect:
          replied: true
