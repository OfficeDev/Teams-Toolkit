name: smoke_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

# Manual-only: registering this definition cannot disturb existing CI.
# Flip to a `pr:` / `trigger:` block once a run has been verified green;
# the Unofficial template is already the correct one for unreviewed PR code.
trigger: none
pr: none

variables:
  - name: nodeVersion
    value: '22.17'
  - name: pnpmVersion
    value: '8.6.12'
  # 1ES network isolation sinkholes registry.npmjs.org to 192.0.2.x, so restores
  # must go through the feed proxy. Passed per-step rather than added to the
  # root .npmrc, which GitHub Actions and local dev also read.
  - name: npmRegistry
    value: 'https://packagefeedproxy.microsoft.io/npm/'

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

# Azure-Pipelines-1ESPT-ExDShared only accepts jobs issued by a 1ES template,
# so the pool and the `extends` block have to change together.
extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        os: windows
        image: windows-latest
      # No .config/tsaoptions.json exists in this repo yet.
      tsa:
        enabled: false

    stages:
      - stage: validate
        displayName: Validate
        jobs:
          - job: smoke
            displayName: Build and test @microsoft/app-manifest
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              os: windows
              image: windows-latest
            steps:
              - checkout: self
                clean: true
                fetchDepth: 1

              - pwsh: |
                  Write-Host "Agent.Name=$(Agent.Name)"
                  Write-Host "Agent.OS=$(Agent.OS)"
                  Write-Host "Build.SourceBranch=$(Build.SourceBranch)"
                  Write-Host "Build.SourceVersion=$(Build.SourceVersion)"
                  git --version
                displayName: Report agent context

              - task: UseNode@1
                displayName: Install Node.js
                inputs:
                  version: $(nodeVersion)

              # Corepack is avoided on purpose: activating pnpm through it
              # contacts Corepack's public version-metadata endpoint, which
              # 1ES agents block.
              - script: npm install -g pnpm@$(pnpmVersion) --registry=$(npmRegistry)
                displayName: Install pnpm

              # Filtered install keeps the smoke run fast; a full workspace
              # install is not needed to prove the agent can restore this
              # repo's dependency graph.
              - script: pnpm install --frozen-lockfile --registry=$(npmRegistry) --filter @microsoft/app-manifest...
                displayName: Install dependencies (manifest slice)

              - script: pnpm --filter @microsoft/app-manifest build
                displayName: Build @microsoft/app-manifest

              - script: pnpm --filter @microsoft/app-manifest test:unit
                displayName: Unit test @microsoft/app-manifest
