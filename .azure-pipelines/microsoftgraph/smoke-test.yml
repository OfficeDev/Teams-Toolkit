name: smoke_$(SourceBranchName)_$(Date:yyyyMMdd)$(Rev:.r)

# Manual-only: registering this definition cannot disturb existing CI.
# Flip to a `pr:` / `trigger:` block once a run has been verified green;
# the Unofficial template is already the correct one for unreviewed PR code.
trigger: none
pr: none

parameters:
  # Tag of the GitHub Release holding the packed .tgz assets, produced by
  # .github/workflows/pack-npm-packages.yml. Release assets are anonymous on this
  # public repo, so no credential is involved — the same source the vsix and
  # templates releases are consumed from today.
  # Empty = skip the download stage and only run the build/test job.
  - name: githubReleaseTag
    type: string
    default: ''

variables:
  - name: nodeVersion
    value: '22.17'
  - name: pnpmVersion
    value: '8.6.12'
  # 1ES network isolation sinkholes registry.npmjs.org to 192.0.2.x, so restores
  # must go through the feed proxy. Passed per-step rather than added to the
  # root .npmrc, which GitHub Actions and local dev also read.
  - name: npmRegistry
    value: 'https://packagefeedproxy.microsoft.io/npm/'
  - name: githubRepo
    value: 'OfficeDev/microsoft-365-agents-toolkit'
  # Folder the ESRP Release task will eventually point `folderlocation` at.
  - name: npmPackagesDir
    value: '$(Build.SourcesDirectory)/npm-packages'

resources:
  repositories:
    - repository: 1ESPipelineTemplates
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release

# Azure-Pipelines-1ESPT-ExDShared only accepts jobs issued by a 1ES template,
# so the pool and the `extends` block have to change together.
extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        os: windows
        image: windows-latest
      # No .config/tsaoptions.json exists in this repo yet.
      tsa:
        enabled: false

    stages:
      - stage: validate
        displayName: Validate
        jobs:
          - job: smoke
            displayName: Build and test @microsoft/app-manifest
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              os: windows
              image: windows-latest
            steps:
              - checkout: self
                clean: true
                fetchDepth: 1

              - pwsh: |
                  Write-Host "Agent.Name=$(Agent.Name)"
                  Write-Host "Agent.OS=$(Agent.OS)"
                  Write-Host "Build.SourceBranch=$(Build.SourceBranch)"
                  Write-Host "Build.SourceVersion=$(Build.SourceVersion)"
                  git --version
                displayName: Report agent context

              - task: UseNode@1
                displayName: Install Node.js
                inputs:
                  version: $(nodeVersion)

              # # Corepack is avoided on purpose: activating pnpm through it
              # # contacts Corepack's public version-metadata endpoint, which
              # # 1ES agents block.
              # - script: npm install -g pnpm@$(pnpmVersion) --registry=$(npmRegistry)
              #   displayName: Install pnpm

              # # Filtered install keeps the smoke run fast; a full workspace
              # # install is not needed to prove the agent can restore this
              # # repo's dependency graph.
              # - script: pnpm install --frozen-lockfile --registry=$(npmRegistry) --filter @microsoft/app-manifest...
              #   displayName: Install dependencies (manifest slice)

              # - script: pnpm --filter @microsoft/app-manifest build
              #   displayName: Build @microsoft/app-manifest

              # - script: pnpm --filter @microsoft/app-manifest test:unit
              #   displayName: Unit test @microsoft/app-manifest

      # Feasibility probe for the ESRP npm publish design:
      #   GitHub Actions packs the workspace into .tgz files and attaches them to a
      #   GitHub Release; this pipeline downloads those assets and hands the folder
      #   to EsrpRelease@12 (contentsource: Folder). This stage only proves the
      #   download half — it does NOT publish anything.
      - stage: npm_packages
        displayName: Download packed npm packages
        dependsOn: []
        condition: ne('${{ parameters.githubReleaseTag }}', '')
        jobs:
          - job: download
            displayName: Download .tgz files from GitHub
            pool:
              name: Azure-Pipelines-1ESPT-ExDShared
              os: windows
              image: windows-latest
            templateContext:
              outputs:
                - output: pipelineArtifact
                  displayName: Publish npm-packages folder
                  targetPath: $(npmPackagesDir)
                  artifactName: npm-packages
            steps:
              - checkout: none

              # Separated from the download so a network block on api.github.com is
              # distinguishable from an auth/artifact-name failure.
              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  foreach ($url in @(
                    'https://api.github.com/repos/$(githubRepo)',
                    'https://api.github.com/zen'
                  )) {
                    try {
                      $r = Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing -TimeoutSec 30
                      Write-Host "OK   $url -> $($r.StatusCode)"
                    } catch {
                      Write-Host "FAIL $url -> $($_.Exception.Message)"
                    }
                  }
                displayName: Probe GitHub reachability

              # Release assets are public, so no credential is involved at all —
              # the same source the vsix and templates releases are consumed from.
              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $headers = @{
                    Accept                 = 'application/vnd.github+json'
                    'X-GitHub-Api-Version' = '2022-11-28'
                    'User-Agent'           = 'atk-azdo-smoke-test'
                  }

                  $tag = '${{ parameters.githubReleaseTag }}'
                  $relUrl = "https://api.github.com/repos/$(githubRepo)/releases/tags/$([uri]::EscapeDataString($tag))"
                  Write-Host "GET $relUrl (anonymous)"
                  $release = Invoke-RestMethod -Uri $relUrl -Headers $headers

                  $assets = @($release.assets | Where-Object { $_.name -like '*.tgz' })
                  Write-Host "Assets on release: $($release.assets.name -join ', ')"
                  if ($assets.Count -eq 0) { throw "Release '$tag' has no .tgz assets." }

                  New-Item -ItemType Directory -Force -Path '$(npmPackagesDir)' | Out-Null
                  foreach ($a in $assets) {
                    $dest = Join-Path '$(npmPackagesDir)' $a.name
                    Write-Host "Downloading $($a.name) ($($a.size) bytes)"
                    Invoke-WebRequest -Uri $a.browser_download_url -OutFile $dest -UseBasicParsing
                  }
                displayName: Download .tgz release assets

              - pwsh: |
                  $ErrorActionPreference = 'Stop'
                  $tgz = Get-ChildItem -Path '$(npmPackagesDir)' -Filter *.tgz -Recurse -File
                  if ($tgz.Count -eq 0) { throw "No .tgz files found under $(npmPackagesDir)." }
                  Write-Host "Found $($tgz.Count) .tgz file(s) for ESRP folderlocation:"
                  $tgz | ForEach-Object {
                    Write-Host ("  {0}  ({1:N0} bytes)" -f $_.FullName.Replace('$(npmPackagesDir)', 'npm-packages'), $_.Length)
                  }
                displayName: Verify ESRP folder layout

              # Publish step, intentionally left out until the ESRP onboarding
              # (managed identity, key vault, sign cert, collaborators) is done:
              #
              # - task: EsrpRelease@12
              #   displayName: Publish to npm
              #   inputs:
              #     connectedservicename: '<service-connection>'
              #     usemanagedidentity: true
              #     keyvaultname: '<key-vault>'
              #     signcertname: '<sign-cert>'
              #     clientid: '<client-id>'
              #     intent: 'PackageDistribution'
              #     contenttype: 'npm'
              #     contentsource: 'Folder'
              #     folderlocation: '$(npmPackagesDir)'
              #     waitforreleasecompletion: true
              #     owners: '<owner>@microsoft.com'
              #     approvers: '<approver>@microsoft.com'
              #     serviceendpointurl: 'https://api.esrp.microsoft.com'
              #     mainpublisher: 'ESRPRELPACMAN'
              #     domaintenantid: '975f013f-7f24-47e8-a7d3-abc4752bf346'
